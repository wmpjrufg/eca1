<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1325 1160" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="2"/>
    </pattern>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 1 L 1 5 L 10 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1325" height="1160" fill="#ffffff"/>

  <!-- grid geometry: x0=90 x1=675 x2=1295 | y0=90 y1=600 y2=1085 -->

  <!-- beams (double lines) -->
  <g stroke="#000000" stroke-width="2.5" fill="none">
    <!-- V1: top beam -->
    <line x1="90" y1="82" x2="1295" y2="82"/>
    <line x1="90" y1="98" x2="1295" y2="98"/>
    <!-- V2: middle beam -->
    <line x1="90" y1="592" x2="1295" y2="592"/>
    <line x1="90" y1="608" x2="1295" y2="608"/>
    <!-- V3: bottom beam -->
    <line x1="90" y1="1077" x2="1295" y2="1077"/>
    <line x1="90" y1="1093" x2="1295" y2="1093"/>
    <!-- V4: left beam -->
    <line x1="82" y1="90" x2="82" y2="1085"/>
    <line x1="98" y1="90" x2="98" y2="1085"/>
    <!-- V5: middle beam -->
    <line x1="667" y1="90" x2="667" y2="1085"/>
    <line x1="683" y1="90" x2="683" y2="1085"/>
    <!-- V6: right beam -->
    <line x1="1287" y1="90" x2="1287" y2="1085"/>
    <line x1="1303" y1="90" x2="1303" y2="1085"/>
  </g>

  <!-- columns at the 9 grid intersections -->
  <g stroke="#000000" stroke-width="2">
    <rect x="76" y="76" width="28" height="28" fill="url(#hatch)"/>
    <rect x="661" y="76" width="28" height="28" fill="url(#hatch)"/>
    <rect x="1281" y="76" width="28" height="28" fill="url(#hatch)"/>
    <rect x="76" y="586" width="28" height="28" fill="url(#hatch)"/>
    <rect x="661" y="586" width="28" height="28" fill="url(#hatch)"/>
    <rect x="1281" y="586" width="28" height="28" fill="url(#hatch)"/>
    <rect x="76" y="1071" width="28" height="28" fill="url(#hatch)"/>
    <rect x="661" y="1071" width="28" height="28" fill="url(#hatch)"/>
    <rect x="1281" y="1071" width="28" height="28" fill="url(#hatch)"/>
  </g>

  <!-- beam labels -->
  <g font-size="24">
    <text x="130" y="70">V1</text>
    <text x="130" y="580">V2</text>
    <text x="130" y="1065">V3</text>
  </g>
  <g font-size="24" transform="rotate(-90)">
    <text x="-620" y="70">V4</text>
    <text x="-620" y="655">V5</text>
    <text x="-620" y="1275">V6</text>
  </g>

  <!-- horizontal dimensions (bay widths) -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="90" y1="45" x2="675" y2="45" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="675" y1="45" x2="1295" y2="45" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  </g>
  <g font-size="24" text-anchor="middle">
    <text x="382" y="32">5,85 m</text>
    <text x="985" y="32">6,20 m</text>
  </g>

  <!-- vertical dimensions (bay heights) -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="635" y1="90" x2="635" y2="600" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="635" y1="600" x2="635" y2="1085" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  </g>
  <g font-size="24" text-anchor="middle">
    <text x="615" y="345" transform="rotate(-90 615 345)">5,10 m</text>
    <text x="615" y="842" transform="rotate(-90 615 842)">4,85 m</text>
  </g>
</svg>
